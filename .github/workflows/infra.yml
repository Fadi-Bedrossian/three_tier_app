# Terraform for Azure (AKS, ACR, PostgreSQL, Key Vault, network) + Helm add-ons.
#   PR / non-main push touching infra -> plan for dev and prod (plan posted to the job summary)
#   push to main                       -> apply dev, then prod after approval (GitHub environment "prod")
name: Infrastructure

on:
  push:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # GitHub OIDC -> Azure (no stored client secrets)
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a running apply

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Plan · ${{ matrix.env }}
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}-plan
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.6
      - run: terraform init -input=false -backend-config=environments/${{ matrix.env }}.backend.hcl
      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=environments/${{ matrix.env }}.tfvars -out=tfplan | tee plan.txt
      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "### Terraform plan · ${{ matrix.env }}"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply-dev:
    name: Apply · dev
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.6
      - run: terraform init -input=false -backend-config=environments/dev.backend.hcl
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m -var-file=environments/dev.tfvars
      - name: Outputs
        run: terraform output >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: Apply · prod
    needs: apply-dev
    runs-on: ubuntu-latest
    environment: prod     # configure required reviewers on this environment
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.1.6
      - run: terraform init -input=false -backend-config=environments/prod.backend.hcl
      - run: terraform apply -input=false -auto-approve -lock-timeout=5m -var-file=environments/prod.tfvars
      - name: Outputs
        run: terraform output >> "$GITHUB_STEP_SUMMARY"
